<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>
  
  <!-- Icon Logo Element: Fast Play & Code MCQ -->
  <g transform="translate(106, 106)">
    <!-- Glow circle -->
    <circle cx="150" cy="150" r="140" fill="#f43f5e" opacity="0.12"/>
    
    <!-- Outer Diamond Shape -->
    <rect x="25" y="25" width="250" height="250" rx="48" fill="url(#roseGrad)" transform="rotate(45 150 150)"/>
    
    <!-- Inner Dark Accent -->
    <rect x="55" y="55" width="190" height="190" rx="36" fill="#020617" transform="rotate(45 150 150)"/>
    
    <!-- Code Play Symbol -->
    <path d="M125 105 L200 150 L125 195 Z" fill="url(#roseGrad)"/>
    <path d="M95 125 L75 150 L95 175" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M205 125 L225 150 L205 175" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
